server:
  port: 8080

spring:
  application:
    name: nooshet-user-service
  datasource:
    url: jdbc:postgresql://postgresql-user:5432/nooshet_user?sslmode=disable
    username: nooshet_user
    password: user_password_123
  jpa:
    hibernate:
      ddl-auto: update

springdoc:
  server-url: "http://95.111.228.89"

  data:
    redis:
      host: ${SPRING_REDIS_HOST:${REDIS_HOST:redis}}
      port: ${SPRING_REDIS_PORT:${REDIS_PORT:6379}}
      timeout: ${SPRING_REDIS_TIMEOUT:2000ms}

logging:
  level:
    root: INFO
    org.nooshet.user: DEBUG
    org.springframework.security: DEBUG

jwt:
  secret: "change-me-in-prod-please-use-a-longer-secret-key-123456"
